server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 정적 파일: 브라우저 캐시 1시간
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 1h;
        access_log off;
        # 다른 포트(=다른 origin)의 spring-hello 페이지에서 폰트·fetch 로 읽을 때 필요
        add_header Access-Control-Allow-Origin "*";
    }

    # k8s probe 용
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}